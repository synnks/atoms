name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: sbt
          cache-read-only: true

      - uses: sbt/setup-sbt@v1.5.13

      - name: Check formatting
        run: sbt scalafmtCheckRepo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: [2.13.18, 3.9.0, 3.10.0]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: sbt
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: sbt/setup-sbt@v1.5.13

      - name: Run full tests
        run: sbt "++ ${{ matrix.scala }}!; core/testFull"

  greenlight:
    if: always()
    needs: [format, test]
    runs-on: ubuntu-latest

    steps:
      - name: Require all checks to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$JOB_RESULTS"
