name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
          cache-read-only: true

      - uses: sbt/setup-sbt@v1.5.12

      - name: Check formatting
        run: sbt scalafmtCheckRepo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: [2.13.18, 3.9.0, 3.10.0]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: sbt/setup-sbt@v1.5.12

      - name: Run full tests
        run: sbt "++ ${{ matrix.scala }}!; core/testFull"
