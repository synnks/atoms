name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read

    steps:
      - name: Require successful greenlight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          check_runs=$(gh api "/repos/$REPO/commits/$SHA/check-runs")

          required_check=greenlight
          conclusion=$(jq -r --arg check "$required_check" '[.check_runs[] | select(.name == $check)] | first | .conclusion // "missing"' <<< "$check_runs")
          if [ "$conclusion" != "success" ]; then
            echo "Required check '$required_check' did not succeed for $SHA. Conclusion: $conclusion"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: verify-ci
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: sbt
          cache-read-only: true

      - uses: sbt/setup-sbt@v1.5.14

      - name: Publish to Maven Central
        run: sbt ci-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
